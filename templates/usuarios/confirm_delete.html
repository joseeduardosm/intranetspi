{% extends "base.html" %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'usuarios/css/usuarios.css' %}">{% endblock %}

{% block content %}
  <div class="spi-page-title">
    <h1>{{ titulo }}</h1>
    <p>{{ descricao }}</p>
  </div>

  <form method="post" class="card border-0 shadow-sm">
    {% csrf_token %}
    <div class="card-body p-4">
      <p class="mb-0">Esta ação não pode ser desfeita.</p>
    </div>
    <div class="card-footer bg-white d-flex justify-content-end gap-2 p-3">
      <a class="btn btn-light" href="javascript:history.back()">Cancelar</a>
      <button class="btn btn-danger" type="submit">Excluir</button>
    </div>
  </form>
{% endblock %}
