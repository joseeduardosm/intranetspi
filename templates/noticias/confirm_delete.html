{% extends "base.html" %}
<!-- Criado por José Eduardo Santana Martins em 04/06/2026 -->
<!-- Objetivo: Confirmar a exclusão de uma notícia no painel editorial. -->

{% block content %}
  <!-- Confirma a ação destrutiva antes de enviar o POST de exclusão. -->
  <div class="spi-page-title">
    <h1>Excluir noticia</h1>
    <p>Confirme a exclusao de "{{ object }}".</p>
  </div>
  <form method="post" class="card border-0 shadow-sm">
    <div class="card-body p-4">
      {% csrf_token %}
      <p class="mb-0">Esta acao nao pode ser desfeita.</p>
    </div>
    <div class="card-footer bg-white d-flex justify-content-end gap-2 p-3">
      <a class="btn btn-light" href="{% url 'noticias:manage_list' %}">Cancelar</a>
      <button class="btn btn-danger" type="submit">Excluir</button>
    </div>
  </form>
{% endblock %}
