<!-- Renderiza a tela de autenticação para usuários corporativos ou locais. -->
{% extends "base.html" %}

{% block content %}
  <!-- Formulário simples de login com erros do backend de autenticação. -->
  <div class="row min-vh-75 align-items-center justify-content-center">
    <div class="col-12 col-md-7 col-xl-4">
        <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-xl-5">
          <h1 class="h3 mb-1">Aplicações SPI</h1>
          <p class="text-muted mb-4">Entre com seu usuário corporativo ou local.</p>
          <form method="post" class="vstack gap-3">
            {% csrf_token %}
            {% if form.non_field_errors %}
              <div class="alert alert-danger">{{ form.non_field_errors }}</div>
            {% endif %}
            <div>
              <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
              <input type="text" name="{{ form.username.html_name }}" autofocus autocapitalize="none" autocomplete="username" maxlength="150" class="form-control form-control-lg" id="{{ form.username.id_for_label }}">
            </div>
            <div>
              <label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>
              <input type="password" name="{{ form.password.html_name }}" autocomplete="current-password" class="form-control form-control-lg" id="{{ form.password.id_for_label }}">
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
