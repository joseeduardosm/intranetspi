{% extends "base.html" %}
{% load static %}
{% block title %}{{ form_title }} | RegulaSGI{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'regulariza_sgi/css/regulariza_sgi.css' %}">{% endblock %}
{% block content %}
  <div class="regulariza-shell">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
      <div class="spi-page-title mb-0">
        <h1>{{ form_title }}</h1>
        <p>{{ imovel.inscricao_imobiliaria }}</p>
      </div>
      <a class="btn btn-outline-secondary" href="{% url 'regulariza_sgi:imovel_detail' imovel.pk %}">Voltar</a>
    </div>
    <form method="post" enctype="multipart/form-data" class="card shadow-sm border-0 regulariza-form-card">
      <div class="card-body p-4">
        {% csrf_token %}
        {{ form.as_p }}
      </div>
      <div class="card-footer bg-white d-flex justify-content-end gap-2 p-4">
        <a class="btn btn-outline-secondary" href="{% url 'regulariza_sgi:imovel_detail' imovel.pk %}">Cancelar</a>
        <button class="btn btn-primary" type="submit">Salvar</button>
      </div>
    </form>
  </div>
{% endblock %}
