{% extends "base.html" %}
{% load static %}
<!-- Criado por José Eduardo Santana Martins e OpenAI Codex em 08/06/2026 -->
<!-- Objetivo: Confirmar a exclusão de um item financeiro da V2 sem confundir com o contrato inteiro. -->
{% block extra_css %}<link rel="stylesheet" href="{% static 'contratos/css/contratos.css' %}">{% endblock %}

{% block content %}
  <div class="card border-0 shadow-sm contratos-form-card">
    <div class="card-body p-4">
      <h1 class="h3 mb-3">Excluir item do contrato</h1>
      <p class="text-muted">Confirma a exclusão do item <strong>{{ object.ordem }} - {{ object.descricao }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-end">
          <a class="btn btn-light" href="{% url 'contratos:contrato_detail' contrato.pk %}">Cancelar</a>
          <button class="btn btn-danger" type="submit">Excluir item</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
