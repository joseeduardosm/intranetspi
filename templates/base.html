{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Aplicações SPI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'licitacoes/css/licitacoes.css' %}">
  </head>
  <body class="spi-body">
    <nav class="navbar navbar-expand-lg navbar-dark spi-navbar shadow-sm">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-semibold" href="{% url 'home' %}">Aplicações SPI</a>
        <div class="d-flex gap-2 align-items-center">
          {% if request.user.is_authenticated %}
            <span class="text-white-50 small">{{ request.user.username }}</span>
            <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Sair</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container-fluid spi-container py-4">
      {% if messages %}
        <div class="mb-3">
          {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} mb-2">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <footer class="spi-footer border-top">
      <div class="container-fluid px-4 py-3 text-muted small">Aplicações SPI</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
